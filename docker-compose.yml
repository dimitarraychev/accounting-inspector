services:
  business-analytics:
    build:
      context: .
      network: host
    image: business-analytics:latest
    container_name: business-analytics
    ports:
      - "8087:80"
      - "14443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx.crt:/etc/nginx/ssl/nginx.crt:ro
      - ./nginx.key:/etc/nginx/ssl/nginx.key:ro
    restart: always

networks:
  default:
    name: global-link
    external: true
